<!DOCTYPE html>
<html lang="en">
<head>
    <title>tables and hyperlinks</title>
</head>
<body>
    <table border="2px"cell spacing="1px">
        <tr>
            <th>s.no</th>
            <th>name of the website</th>
            <th>links</th>
        </tr>
        <tr>
            <td>1</td>
            <td>google</td>
            <td><a href="https://www.google.com"target="_blank">google</a></td>
        </tr>
        <tr>
            <td>2</td>
            <td>netflix</td>
            <td><a href="https://www.netflix.com"target="_blank">netflix</a></td>
        </tr>
        <tr>
            <td>3</td>
            <td>youtube</td>
            <td><a href="https://www.youtube.com"target="_blank">youtube</a></td>
        </tr>
    </table>
</body>
</html>
